name: Gorraiz · SPC y balance FV

on:
  pull_request:
    paths:
      - "index.html"
      - "scada.html"
      - "scada-*.mjs"
      - "scada-preview/**"
      - "energia.js"
      - "worker/**"
      - "tests/**"
      - ".github/workflows/gorraiz-ci.yml"
      - "wrangler.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests de energía, SPC y dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ejecutar pruebas sin credenciales
        run: node --test tests/*.test.mjs
      - name: Reconstruir Worker para editor web
        run: node worker/construir.mjs
      - name: Comprobar sintaxis JavaScript
        run: |
          node --check energia.js
          node --check scada-data.mjs
          node --check scada-units.mjs
          node --check scada-preview/scada-data.mjs
          node --check scada-app.mjs
          node --check scada-sync.mjs
          node --check worker/shared-history.js
          node --check scada-quota.mjs
          node --check worker/index.js
          node --check worker/spc.js
          node --check worker/kstar-prueba.js
          node --check worker/bundle.js
          node --check worker/kstar-prueba-bundle.js
      - name: Confirmar que bundle.js está actualizado
        run: git diff --exit-code -- worker/bundle.js worker/kstar-prueba-bundle.js

  cloudflare-dry-run:
    name: Wrangler dry-run · sin desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar que previews no accede al almacén de producción
        run: |
          python - <<'PY'
          import tomllib
          with open("worker/wrangler.toml", "rb") as f:
              config = tomllib.load(f)
          preview = config["previews"]
          assert not preview.get("kv_namespaces"), "Preview no debe montar KV de producción"
          assert preview["vars"]["SPC_SYNC_ENABLED"] == "false"
          assert "PANEL_KEY" not in preview["vars"]
          assert "SPC_PASS" not in preview["vars"]
          with open("wrangler.toml", "rb") as f:
              shim = tomllib.load(f)
          assert shim["name"] == config["name"]
          assert shim["main"] == "worker/index.js"
          assert shim["workers_dev"] is False
          assert not shim.get("kv_namespaces")
          assert not shim.get("vars")
          assert not shim.get("triggers")
          assert shim["previews"]["vars"] == {"SPC_SYNC_ENABLED": "false"}
          print("Preview raíz aislada de producción, sin secretos, KV ni cron")
          PY
      - name: Compilar Worker sin credenciales ni despliegue
        run: npx --yes wrangler@4.145.0 deploy --dry-run --config worker/wrangler.toml
      - name: Probar el Durable Object de cupo en workerd local, sin llamar al proveedor
        run: |
          npx --yes wrangler@4.145.0 dev --local --config worker/wrangler.toml \
            --ip 127.0.0.1 --port 8799 --var PANEL_KEY:clave-sintetica \
            --var SOLARMAN_APPID:appId-sintetico \
            --show-interactive-dev-session=false > /tmp/gorraiz-workerd.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; cat /tmp/gorraiz-workerd.log' EXIT
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          url='http://127.0.0.1:8799/produccion'
          headers={'Origin':'https://imoriana3.github.io',
                   'X-Panel-Key':'clave-sintetica','Content-Type':'application/json'}
          # Una fecha imposible pasa el filtro de formato público y debe ser
          # rechazada por el DO *antes* de intentar acceder a Solarman.
          req=urllib.request.Request(url,
              data=json.dumps({'desde':'2026-02-30','hasta':'2026-02-30'}).encode(),
              headers=headers, method='POST')
          for attempt in range(45):
              try:
                  urllib.request.urlopen(req,timeout=2)
                  raise AssertionError('El DO no debe admitir fecha imposible')
              except urllib.error.HTTPError as exc:
                  body=json.load(exc)
                  assert exc.code==400,(exc.code,body)
                  assert 'Rango Solarman' in body.get('error',''),body
                  print('workerd local: binding DO activo, ruta protegida, rechazo 400 previo al proveedor')
                  break
              except (urllib.error.URLError,TimeoutError):
                  time.sleep(1)
          else:
              raise AssertionError('workerd no inició; revisar /tmp/gorraiz-workerd.log')
          # Probar el histórico SQLite real del DO (sin llamadas a proveedores).
          api='http://127.0.0.1:8799'
          def call(path,method='POST',data=None):
              request=urllib.request.Request(api+path,
                headers=headers,method=method,
                data=json.dumps(data).encode() if data is not None else None)
              with urllib.request.urlopen(request,timeout=15) as r:
                  assert r.status==200, r.status
                  return json.load(r)
          day='2026-10-19'
          sample={'items':[{'tipo':'A','fecha':day,'unidadPotencia':'kW','rows':[{
              'ts':day+'T10:05:00','pot':22.5,'acum':2000,'dia':150000.0}]}]}
          # Preflight del mismo Worker SIN escritura antes de incorporar datos.
          validated=call('/historico/validar',data=sample)
          assert validated['version']=='migracion-v3',validated
          assert validated['validas']==1,validated
          assert validated['aceptadas'][0]['energiaSinValidar']==1,validated
          before=call('/historico/estado',method='GET')
          assert before['cobertura']['A']['dias']==0,before
          saved=call('/historico/guardar',data=sample)
          assert saved['version']=='migracion-v3',saved
          assert saved['guardadas']==1 and saved['pendientesEnergia']==1,saved
          data=call('/historico/datos',data={'desde':day,'hasta':day})
          assert len(data['fuentes'])==1,data
          assert data['fuentes'][0]['rows'][0]['pot']==22.5,data
          assert data['fuentes'][0]['rows'][0]['dia'] is None,data
          assert data['fuentes'][0]['rows'][0]['diaSinValidar']==150000.0,data
          overview=call('/historico/estado',method='GET')
          assert overview['cobertura']['A']['dias']>=1,overview
          assert data['meta']['proveedorConsultado'] is False,data
          print('workerd SQLite: guardar, leer y cobertura de la base común; 0 consultas a proveedor.')
          PY

  scada-chromium:
    name: SCADA Chromium · QA sin datos privados
    # Imagen fijada a propósito: ubuntu-latest rodó a Ubuntu 26.04 y
    # playwright@1.55.1 no soporta esa plataforma, así que el job moría
    # instalando el navegador y la prueba de humo ni llegaba a ejecutarse.
    # 24.04 tiene soporte hasta 2029. Al subir Playwright se puede volver
    # a ubuntu-latest, pero eso cambia el navegador con el que se prueba.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar navegador y Chart.js para pruebas sintéticas
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1 chart.js@4.4.1
          npx playwright install --with-deps chromium
      - name: Humo de navegador sin secretos ni consultas reales
        run: node tests/scada-browser.mjs
      - name: Guardar capturas de revisión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scada-gorraiz-qa-capturas
          path: artifacts/scada-*.png
          if-no-files-found: ignore
