# CONFIGURACIÓN CANÓNICA DEL WORKER DE PRODUCCIÓN.
# En Cloudflare, mantener Root directory = "worker": esta es la configuración
# que monta el KV real y declara los parámetros de producción.
# El wrangler.toml de la raíz es un shim mínimo, sin datos, para previews de
# PR (Cloudflare Builds puede ignorar el root directory en ramas).
# Nunca cambiar la raíz de despliegue de producción al repositorio sin revisar.
name = "gorraiz-dashboard"
main = "index.js"
compatibility_date = "2025-01-01"

workers_dev = true
preview_urls = false

# Conserva las variables de texto añadidas desde el panel. Los secretos se
# gestionan aparte; nunca se escriben en este fichero.
keep_vars = true

# Origen(es) desde los que se acepta la llamada. Sin esto, el Worker deniega
# todo: no se abre a cualquiera por descuido. Separar por comas si hace falta
# añadir pruebas en local.
[vars]
ALLOWED_ORIGIN = "https://imoriana3.github.io"
SPC_STATION_ID = "2026032317114373"
SPC_TIMEZONE = "Europe/Madrid"
SPC_SYNC_ENABLED = "false"

# El resto NO va aquí: son secretos y se cargan desde el panel de Cloudflare
# (Settings → Variables and Secrets) o con `wrangler secret put`.

# Almacén compartido del consumo, para que el histórico no viva solo en el
# navegador de una persona. El identificador no es un secreto: sin acceso a
# la cuenta de Cloudflare no sirve de nada, y por eso puede vivir aquí.
[[kv_namespaces]]
binding = "DATOS"
id = "060df5733aad4c61b01cbf05e4d7510b"

# Activar solo después de probar HTTPS, el contador y los kWh de un día cerrado.
# Cada ejecución actualiza el día anterior de Madrid; no requiere abrir el panel.
# El cron usa UTC. Se repite para recoger correcciones o reintentar tras fallos.
# [triggers]
# crons = ["17 * * * *"]

# Vista previa de rama, sin secretos ni almacén de producción.
# Wrangler 4.135+ exige el bloque [previews] para "wrangler preview".
# Los ajustes top-level no se heredan: aquí no se enlaza DATOS ni se
# permite leer/escribir registros energéticos desde una rama en pruebas.
[previews]

[previews.vars]
ALLOWED_ORIGIN = "https://imoriana3.github.io"
SPC_STATION_ID = "2026032317114373"
SPC_TIMEZONE = "Europe/Madrid"
SPC_SYNC_ENABLED = "false"
