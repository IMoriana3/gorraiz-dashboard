# El proyecto de Cloudflare está configurado con Root directory = "worker", así
# que wrangler busca esta configuración AQUÍ. Si alguna vez se vacía ese ajuste,
# wrangler no encontrará ningún Worker en la raíz del repositorio, deducirá que
# es un sitio estático y publicará todos los ficheros tal cual, .git incluida.
name = "gorraiz-dashboard"
main = "index.js"
compatibility_date = "2025-01-01"

workers_dev = true
preview_urls = false

# Origen(es) desde los que se acepta la llamada. Sin esto, el Worker deniega
# todo: no se abre a cualquiera por descuido. Separar por comas si hace falta
# añadir pruebas en local.
[vars]
ALLOWED_ORIGIN = "https://imoriana3.github.io"

# El resto NO va aquí: son secretos y se cargan desde el panel de Cloudflare
# (Settings → Variables and Secrets) o con `wrangler secret put`.
